name: Publish cPanel Deployment Branch

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cpanel-deployment-branch
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish cPanel branch
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Resolve deployment commit
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            sha="${{ github.event.workflow_run.head_sha }}"
          else
            sha="${{ github.sha }}"
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check out exact accepted commit
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.sha }}
          fetch-depth: 1

      - name: Confirm commit is current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          current_main="$(git rev-parse origin/main)"
          if [[ "$current_main" != "${{ steps.release.outputs.sha }}" ]]; then
            echo "Refusing stale deployment branch publication: ${{ steps.release.outputs.sha }} is not current main ($current_main)."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build cPanel game-guide release
        env:
          CD_GUIDE_SITE: https://tkb-gaming.scot
          CD_GUIDE_BASE_PATH: /games/crimson-desert/guides/
          CD_GUIDE_DIST_ROOT: dist-cpanel
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          output="dist-cpanel/games/crimson-desert/guides"
          test -f "$output/index.html"
          test -f "$output/command-centre/index.html"
          test -f "$output/media/hymn-for-the-unsung-blade.m4a"
          rm -f "$output/_headers"
          cat > "$output/.htaccess" <<'HTACCESS'
          DirectoryIndex index.html
          Options -Indexes
          ErrorDocument 404 /games/crimson-desert/guides/404.html
          HTACCESS
          cat > "$output/deployment.json" <<EOF
          {
            "guide": "Crimson Desert Guide",
            "version": "$(node -p "require('./package.json').version")",
            "commit": "${{ steps.release.outputs.sha }}",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "publicUrl": "https://tkb-gaming.scot/games/crimson-desert/guides/"
          }
          EOF

      - name: Prepare cPanel deployment repository
        shell: bash
        run: |
          set -euo pipefail
          rm -rf publish
          mkdir -p publish/site publish/legacy
          cp -a dist-cpanel/games/crimson-desert/guides/. publish/site/

          cat > publish/legacy/.htaccess <<'HTACCESS'
          RewriteEngine On
          RewriteRule ^(.*)$ /games/crimson-desert/guides/$1 [R=301,L,NE]
          HTACCESS

          cat > publish/legacy/index.html <<'HTML'
          <!doctype html>
          <html lang="en-GB">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <meta http-equiv="refresh" content="0; url=/games/crimson-desert/guides/">
              <link rel="canonical" href="https://tkb-gaming.scot/games/crimson-desert/guides/">
              <title>Crimson Desert Guide moved</title>
            </head>
            <body>
              <p>The Crimson Desert Guide has moved to <a href="/games/crimson-desert/guides/">TKB Gaming → Games → Crimson Desert → Game Guides</a>.</p>
            </body>
          </html>
          HTML

          cat > publish/.cpanel.yml <<'CPANEL'
          ---
          deployment:
            tasks:
              - /bin/bash -lc 'set -eu; target="/home/jtdlxqpa/public_html/games/crimson-desert/guides"; legacy="/home/jtdlxqpa/public_html/crimsondesert"; test -d "$target"; test -f "$target/.github-deploy-target"; test "$(cat "$target/.github-deploy-target")" = "crimson-desert-guide"; test -d "$legacy"; test -f "$legacy/.github-deploy-target"; test "$(cat "$legacy/.github-deploy-target")" = "crimson-desert-guide"; test -f site/index.html; test -f site/command-centre/index.html; test -f legacy/.htaccess; test -f legacy/index.html'
              - /bin/bash -lc 'set -eu; target="/home/jtdlxqpa/public_html/games/crimson-desert/guides"; /usr/bin/find "$target" -mindepth 1 -maxdepth 1 ! -name ".github-deploy-target" -exec /bin/rm -rf -- {} +'
              - /bin/cp -a site/. /home/jtdlxqpa/public_html/games/crimson-desert/guides/
              - /bin/bash -lc 'set -eu; test -f /home/jtdlxqpa/public_html/games/crimson-desert/guides/index.html; test -f /home/jtdlxqpa/public_html/games/crimson-desert/guides/deployment.json; test -f /home/jtdlxqpa/public_html/games/crimson-desert/guides/.github-deploy-target'
              - /bin/bash -lc 'set -eu; legacy="/home/jtdlxqpa/public_html/crimsondesert"; /usr/bin/find "$legacy" -mindepth 1 -maxdepth 1 ! -name ".github-deploy-target" -exec /bin/rm -rf -- {} +'
              - /bin/cp -a legacy/. /home/jtdlxqpa/public_html/crimsondesert/
              - /bin/bash -lc 'set -eu; test -f /home/jtdlxqpa/public_html/crimsondesert/.htaccess; test -f /home/jtdlxqpa/public_html/crimsondesert/index.html; test -f /home/jtdlxqpa/public_html/crimsondesert/.github-deploy-target'
          CPANEL

          cat > publish/README.md <<EOF
          # Crimson Desert Guide — cPanel deployment branch

          This branch contains generated production files only. Do not edit it manually.

          - Source branch: `main`
          - Source commit: `${{ steps.release.outputs.sha }}`
          - Public hierarchy: TKB Gaming → Games → Crimson Desert → Game Guides
          - Public URL: https://tkb-gaming.scot/games/crimson-desert/guides/
          - cPanel target: `/home/jtdlxqpa/public_html/games/crimson-desert/guides`
          - Legacy redirect: `https://tkb-gaming.scot/crimsondesert/`

          Use cPanel Git Version Control → **Update from Remote** → **Deploy HEAD Commit**.
          EOF

      - name: Publish generated cPanel branch
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rm -rf publish-repository
          git clone --filter=blob:none --no-checkout "$remote" publish-repository
          cd publish-repository
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin cpanel-deploy >/dev/null 2>&1; then
            git fetch --depth=1 origin cpanel-deploy
            git checkout -B cpanel-deploy origin/cpanel-deploy
            git rm -rf .
          else
            git checkout --orphan cpanel-deploy
            git rm -rf . >/dev/null 2>&1 || true
          fi

          cp -a ../publish/. .
          git add -A
          git commit -m "Publish cPanel build for ${RELEASE_SHA}"
          git push origin cpanel-deploy

      - name: Record publication summary
        shell: bash
        run: |
          {
            echo "### cPanel deployment branch published"
            echo ""
            echo "- Source commit: \`${{ steps.release.outputs.sha }}\`"
            echo "- Deployment branch: \`cpanel-deploy\`"
            echo "- Public URL: https://tkb-gaming.scot/games/crimson-desert/guides/"
            echo "- Legacy URL becomes a permanent redirect after cPanel deployment"
            echo "- Next step in cPanel: **Update from Remote**, then **Deploy HEAD Commit**"
          } >> "$GITHUB_STEP_SUMMARY"
