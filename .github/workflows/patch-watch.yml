name: Official Patch Watch

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: official-patch-watch
  cancel-in-progress: false

jobs:
  inspect:
    name: Inspect Official Updates
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false

      - name: Compare official patch listing
        run: node scripts/check-official-patches.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
