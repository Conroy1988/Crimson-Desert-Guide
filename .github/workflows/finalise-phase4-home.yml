name: Finalise Phase 4 Homepage

on:
  push:
    branches:
      - agent/phase4-combat-gear
    paths:
      - .github/workflows/finalise-phase4-home.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out Phase 4 branch
        uses: actions/checkout@v6
        with:
          ref: agent/phase4-combat-gear

      - name: Update live guide count
        shell: bash
        run: |
          set -euo pipefail
          perl -0pi -e 's/<div><strong>13<\/strong><span>live guide pages<\/span><\/div>/<div><strong>16<\/strong><span>live guide pages<\/span><\/div>/' src/components/HomeExperience.astro
          rm .github/workflows/finalise-phase4-home.yml

      - name: Commit generated homepage metric
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/HomeExperience.astro .github/workflows/finalise-phase4-home.yml
          git commit -m "Update homepage guide count"
          git push origin HEAD:agent/phase4-combat-gear
