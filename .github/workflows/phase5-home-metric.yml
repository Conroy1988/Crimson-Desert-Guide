name: Phase 5 Home Metric

on:
  push:
    branches:
      - agent/phase5-world-mounts
    paths:
      - .github/workflows/phase5-home-metric.yml

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase5-world-mounts
      - name: Update generated homepage metric
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/components/HomeExperience.astro')
          source = path.read_text()
          old = '<div><strong>16</strong><span>live guide pages</span></div>'
          new = '<div><strong>18</strong><span>live guide pages</span></div>'
          if old not in source:
              raise SystemExit('Expected Phase 4 homepage metric was not found')
          path.write_text(source.replace(old, new, 1))
          PY
          rm .github/workflows/phase5-home-metric.yml
      - name: Commit generated update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/HomeExperience.astro .github/workflows/phase5-home-metric.yml
          git commit -m "Phase 5: publish world and mounts page count"
          git push origin HEAD:agent/phase5-world-mounts
