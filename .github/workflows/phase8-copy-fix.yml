name: Phase 8 copy correction
on:
  push:
    branches: [agent/phase8-content-database]
    paths: [.github/workflows/phase8-copy-fix.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase8-content-database
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/components/HomeExperience.astro')
          s=p.read_text().replace("detail: '67 verified records'", "detail: '67 sourced records'")
          p.write_text(s)
          PY
          rm .github/workflows/phase8-copy-fix.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Phase 8: correct database coverage label"
          git push origin HEAD:agent/phase8-content-database
