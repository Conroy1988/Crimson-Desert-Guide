name: Apply Patch 1.15 Baseline

on:
  push:
    branches:
      - agent/patch-1.15.00
    paths:
      - .github/workflows/apply-patch-1-15.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out patch branch
        uses: actions/checkout@v6
        with:
          ref: agent/patch-1.15.00

      - name: Update page metadata and homepage intelligence
        shell: bash
        run: |
          set -euo pipefail
          find src/content/docs -type f \( -name '*.md' -o -name '*.mdx' \) -print0 \
            | xargs -0 perl -0pi -e 's/^currentPatch: 1\.14\.00$/currentPatch: 1.15.00/gm'
          perl -0pi -e "s/Live · Patch 1\.14\.00/Live · Patch 1.15.00/g; s/Version 1\.14\.00/Version 1.15.00/g" src/components/HomeExperience.astro
          rm .github/workflows/apply-patch-1-15.yml

      - name: Commit generated baseline update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/docs src/components/HomeExperience.astro .github/workflows/apply-patch-1-15.yml
          git commit -m "Apply Patch 1.15 baseline"
          git push origin HEAD:agent/patch-1.15.00
