name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate content and build
        run: npm run check:all

      - name: Upload website and Steam export
        uses: actions/upload-artifact@v7
        with:
          name: crimson-desert-guide-${{ github.sha }}
          path: |
            dist/
            artifacts/steam-guide.bbcode
          retention-days: 7
