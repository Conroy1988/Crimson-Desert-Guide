name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate content and both deployment modes
        shell: bash
        run: |
          set +e
          npm run check:ci 2>&1 | tee validation.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload website, subpath build, Steam export and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: crimson-desert-guide-${{ github.sha }}
          path: |
            validation.log
            dist/
            dist-subpath/
            artifacts/steam-guide.bbcode
            package-lock.json
          if-no-files-found: warn
          retention-days: 7
