name: Phase 12 Final Integration

on:
  push:
    branches:
      - agent/phase12-character-build-lab

permissions:
  contents: write

concurrency:
  group: phase12-final-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/phase12-character-build-lab
          fetch-depth: 0
      - name: Apply v1 integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          home = Path('src/components/HomeExperience.astro')
          text = home.read_text()
          anchor = "  { label: 'Content database', detail: '85 sourced records', icon: 'scroll', href: '/database/' },\n"
          addition = anchor + "  { label: 'Character mastery', detail: '3 playable profiles', icon: 'swords', href: '/systems/characters/' },\n  { label: 'Build laboratory', detail: '8 test archetypes', icon: 'gear', href: '/systems/build-lab/' },\n"
          if anchor not in text:
              raise SystemExit('Homepage quick-link anchor not found')
          text = text.replace(anchor, addition, 1)
          text = text.replace("  { label: 'Core Systems', count: 4, width: 100 },", "  { label: 'Core Systems', count: 6, width: 100 },", 1)
          update_anchor = "const latestUpdates = [\n"
          update = "const latestUpdates = [\n  {\n    label: 'v1.0',\n    title: 'Character mastery and Build Laboratory',\n    description: 'Three current-patch profiles, eight transparent archetypes and a repository-generated evidence-closure report.',\n    href: '/standards/v1-readiness/',\n  },\n"
          if update_anchor not in text:
              raise SystemExit('Homepage update anchor not found')
          text = text.replace(update_anchor, update, 1)
          home.write_text(text)

          log = Path('src/content/docs/update-log.md')
          text = log.read_text()
          marker = '## 26 July 2026 — Collectibles, knowledge and challenge catalogue\n'
          entry = '''## 26 July 2026 — Character mastery, Build Laboratory and v1.0 evidence closure

- Added current-patch capability profiles for Kliff, Oongka and Damiane from official Steam and Patch 1.03–1.15 records.
- Added eight transparent build archetypes covering field balance, defence, aerial mobility, ranged pressure, heavy impact, unarmed chains, boss reliability and exploration utility.
- Added a browser-local Build Laboratory with controlled conditions, seven personal observation dimensions, confidence ratings and strict JSON backup/restore.
- Linked current Greymane faction and Damiane Shield Toss issues directly into character and build guidance.
- Added audits that prohibit unsupported tier lists, best-build claims, exact DPS, hidden scaling and unrecorded frame data.
- Added a repository-generated v1.0 readiness report covering 12 guide programmes, every structured dataset, interactive tool and publication path.
- Classified remaining partial game records as an explicit research queue rather than filling unknown routes, totals, rewards or mechanics with guesses.
- Promoted the package and Steam Guide to evidence-safe v1.0.0 for Patch 1.15.00.

'''
          if marker not in text:
              raise SystemExit('Update Log anchor not found')
          text = text.replace(marker, entry + marker, 1)
          log.write_text(text)

          Path('.github/workflows/phase12-final-integration.yml').unlink()
          PY
      - name: Commit v1 integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Phase 12: integrate character mastery and v1 readiness"
          git push origin HEAD:agent/phase12-character-build-lab
