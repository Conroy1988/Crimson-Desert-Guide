name: Website or automation bug
description: Report a broken page, search issue, build problem or automation fault.
title: "[Site Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the page, workflow or feature affected.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser or environment
      placeholder: Chrome 150 on Windows 11
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
